<script>
  const sheetId = "1mXUWt1Swe5CLABggNXLxGPk-0NemX2EQEqQk7nBBMF0";
  const sheetUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?gid=0&tqx=out:json`;

  const params = new URLSearchParams(window.location.search);
  const idBuscado = String(params.get("id") || "").trim();

  const conteudo = document.getElementById("conteudo");

  if (!idBuscado) {
    conteudo.innerHTML = "<div class='erro'>ID não informado</div>";
  } else {
    fetch(sheetUrl)
      .then(res => res.text())
      .then(text => {
        const json = JSON.parse(text.substring(47, text.length - 2));
        const rows = json.table.rows;

        let achou = false;

        rows.forEach(r => {
          if (!r.c || !r.c[0]) return;

          const id = String(r.c[0].v).trim();
          if (id !== idBuscado) return;

          achou = true;

          const nome = String(r.c[1]?.v || "").trim();
          const foto = String(r.c[2]?.v || "").trim();

          const statusRaw = String(r.c[3]?.v || "").trim().toLowerCase();
          const isAtivo = statusRaw === "ativo";

          const veiculo = String(r.c[4]?.v || "").trim();
          const placa = String(r.c[5]?.v || "").trim();
          const cor = String(r.c[6]?.v || "").trim();

          const classe = isAtivo ? "ativo" : "inativo";
          const texto = isAtivo ? "MOTORISTA ATIVO" : "MOTORISTA INATIVO";

          conteudo.innerHTML = `
            <img src="${foto || 'https://via.placeholder.com/160'}" alt="Foto do motorista">
            <h1>${nome}</h1>

            <div style="font-size:14px; text-align:left; margin-top:10px">
              <p><strong>Veículo:</strong> ${veiculo || "-"}</p>
              <p><strong>Placa:</strong> ${placa || "-"}</p>
              <p><strong>Cor:</strong> ${cor || "-"}</p>
            </div>

            <div class="status ${classe}">${texto}</div>
          `;
        });

        if (!achou) {
          conteudo.innerHTML = "<div class='erro'>Motorista não encontrado</div>";
        }
      })
      .catch(err => {
        console.error(err);
        conteudo.innerHTML = "<div class='erro'>Erro ao carregar dados</div>";
      });
  }
</script>
